name: Build Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "launcher-v*"

jobs:
  prepare-release:
    name: "Создать draft-релиз"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Создать draft-релиз (идемпотентно)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo n1orio/mono-launcher \
            --title "Launcher v${GITHUB_REF_NAME#launcher-v}" \
            --notes "Сборка..." \
            --draft || true

  build:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--bundles dmg"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Установить Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux deps (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - name: Install frontend deps
        run: npm ci

      - name: Запустить тесты типов
        run: npm run build

      - name: Собрать лаунчер
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MONO_CURSEFORGE_KEY: ${{ secrets.MONO_CURSEFORGE_KEY }}
        with:
          tagName: launcher-v__VERSION__
          releaseName: "Launcher v__VERSION__"
          releaseDraft: true
          releaseBody: "Лаунчер Mono для сборок."
          args: ${{ matrix.args }}
          prerelease: false
          updateRelease: true

  update-manifest:
    name: "Сформировать latest.json"
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Установить Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Скачать ассеты релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --dir assets

      - name: Собрать и загрузить latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          BODY="$(gh release view "$TAG" --json body --jq .body || true)"
          TAG="$TAG" BODY="$BODY" node scripts/make-updater-json.mjs assets latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Обновить тело релиза из CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#launcher-v}"
          BODY="$(node scripts/release-notes.mjs "$VER" "Лаунчер Mono для сборок.")" || exit 0
          gh release edit "$TAG" --notes "$BODY"