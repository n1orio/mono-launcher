[package]
name = "mono-launcher"
version = "2.0.0-alpha.6"
description = "Фирменный моно-лаунчер для сборки Minecraft (.mrpack)"
authors = ["NIO"]
license = "MIT"
edition = "2021"

[lib]
name = "mono_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }
zip = { version = "2", features = ["deflate", "deflate64"] }
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
anyhow = "1"
dirs = "5"
futures = "0.3"
sysinfo = "0.30"
chrono = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
flate2 = "1.1.9"
tar = "0.4.46"
qrcode = { version = "0.13", default-features = false }
base64 = "0.22"
discord-rich-presence = "1.1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
