[package]
name = "nio-launcher"
version = "0.1.2"
description = "Фирменный моно-лаунчер для сборки Minecraft (.mrpack)"
authors = ["NIO"]
edition = "2021"

[lib]
name = "nio_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
zip = { version = "2", features = ["deflate", "deflate64", "bzip2", "zstd", "lzma"] }
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
anyhow = "1"
dirs = "5"
futures = "0.3"
sysinfo = "0.30"
indicatif = "0.17"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
